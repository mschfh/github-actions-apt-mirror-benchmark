# Benchmarks APT mirrors on GitHub-hosted Ubuntu runners (amd64 + arm64).
#
# Read-only: never modifies sources.list / apt-mirrors.txt (fast-apt-mirror.sh `find`
# without `--apply` only probes and measures).
#
# Tool: https://github.com/vegardit/fast-apt-mirror.sh (pinned to commit 806c59276adfff2df420124ad5e4587f018c358a = tag 1.4.5)
#   - resolves the runner's mirror+file:/etc/apt/apt-mirrors.txt exactly like apt,
#     so priority:1 (azure.archive.ubuntu.com) is always tested as "current"
#   - on arm64 it rewrites candidates to the /ubuntu-ports tree
#   - sequential speed tests (--parallel 1) so runs don't affect each other
#   - sample: ls-lR.gz (~37 MB), identical file on /ubuntu and /ubuntu-ports trees
#
# What fast-apt-mirror.sh does NOT cover, measured here with curl instead:
#   - every entry of /etc/apt/apt-mirrors.txt (archive, security fallbacks)
#     with the identical ls-lR.gz sample => apples-to-apples baseline numbers
name: apt-mirror-benchmark

on:
  workflow_dispatch:
    inputs:
      apt_debug:
        description: "Verbose apt Acquire debug (per-request connect IP / HTTP lines)"
        type: boolean
        default: false
  push:
    branches:
      - main
  schedule:
    - cron: "17 7 * * *" # daily

permissions:
  contents: read
  actions: read # actions-workflow-metrics: per-step metrics via GitHub API

env:
  # fast-apt-mirror.sh, tag 1.4.5 (same content immutable at this commit sha)
  TOOL_VERSION: "806c59276adfff2df420124ad5e4587f018c358a"
  SAMPLE_SIZE_KB: "37800" # ~37 MB = full ls-lR.gz (archive & ports ship the same file), the max useful sample
  SAMPLE_TIME: "30"

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          # NOTE: there is no "ubuntu-latest-arm" label (yet); this is the current ARM label
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    name: bench-${{ matrix.arch }}

    steps:
      - name: Show runner apt mirror configuration
        run: |
          echo "::group::/etc/apt/apt-mirrors.txt"
          cat /etc/apt/apt-mirrors.txt || true
          echo "::endgroup::"
          echo "::group::apt sources (URIs)"
          grep -E "^(URIs:|deb http)" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo "::endgroup::"

      - name: Dump apt acquire config (requests, latency, retries)
        run: |
          # Effective merged apt config for everything that affects how apt
          # issues HTTP requests. Key knobs:
          #   Pipeline-Depth   - max outstanding requests per connection (0 =
          #                      strictly serial: full RTT per file)
          #   No-Cache         - force CDN revalidation on every request
          #   MaxRetries       - per-URI retry count
          #   http::Timeout -o Timeout::<stage> - connect/response/idle timeouts
          #   Queue-Mode       - access|host: ordering of request queues
          #   Proxy*           - proxy settings (none on runners)
          # The runner image bakes /etc/apt/apt.conf.d/99bad_proxy into every
          # ubuntu* image (images/ubuntu/scripts/build/configure-apt.sh) with
          # Pipeline-Depth 0 + No-Cache true + BrokenProxy true - the prime
          # suspect for apt wall-clock being ~10x slower than raw curl.
          echo "::group::99bad_proxy (image-baked conf)"
          cat /etc/apt/apt.conf.d/99bad_proxy 2>/dev/null || echo "(absent on this image)"
          echo "::endgroup::"
          echo "::group::apt-config dump (request-affecting settings)"
          # effective merged values (set values only; anything not listed
          # keeps its built-in default, e.g. Acquire::Retries defaults 0,
          # default pipelining depth is 10)
          apt-config dump | grep '^Acquire' | \
            grep -viE 'IndexTargets|Changelogs|Languages|cdrom|By-Hash|Allow(Insecure|Weak|Downgrade)|CompressionTypes|Compression::|Hashes|Check-Valid|Max-Future|Pool::|Snapshots' || true
          echo "::endgroup::"

      - name: DNS resolution of configured mirror hosts
        run: |
          # dig/dnsutils is preinstalled on the runner images and shows all A
          # records. azure (prio 1) is a regional cloud mirror: it resolves to
          # ONE IP of the region's CDN, while archive.ubuntu.com rotates via
          # round-robin DNS across ~10 IPs.
          cut -f1 /etc/apt/apt-mirrors.txt | awk '/^https?:/ && !seen[$0]++' | \
          while IFS= read -r mirror; do
            host=$(printf '%s\n' "$mirror" | sed -n 's|^https\?://\([^/]*\)/.*|\1|p')
            printf '%s => ' "$host"
            dig A "$host"
          done

      - name: Download fast-apt-mirror.sh (pinned)
        run: |
          curl -fsSL -o /tmp/fast-apt-mirror.sh \
            "https://raw.githubusercontent.com/vegardit/fast-apt-mirror.sh/${TOOL_VERSION}/fast-apt-mirror.sh"
          chmod +x /tmp/fast-apt-mirror.sh

      # ---- everything below runs strictly sequentially --------------------------

      - name: Baseline — every /etc/apt/apt-mirrors.txt entry in priority order
        run: |
          set -uo pipefail
          : > /tmp/baseline.tsv
          cut -f1 /etc/apt/apt-mirrors.txt | awk '/^https?:/ && !seen[$0]++' | while IFS= read -r mirror; do
            echo "timing ${mirror}ls-lR.gz"
            stats=$(curl -fsL -m "$SAMPLE_TIME" -sS -o /dev/null \
                    -w '%{http_code}\t%{time_starttransfer}\t%{size_download}\t%{speed_download}' \
                    "${mirror}ls-lR.gz") || true
            [ -n "$stats" ] || stats=$(printf '000\t0\t0\t0')
            printf '%s\t%s\n' "$mirror" "$stats" | tee -a /tmp/baseline.tsv
          done

      - name: Benchmark top 10 US mirrors + current (fast-apt-mirror.sh)
        run: |
          # `find` without --apply changes nothing on the system.
          # healthchecks 40 (reachability HEAD probes, few bytes each);
          # speedtests 10 = top-10 US mirrors + current mirror + archive reference.
          # stdout -> /tmp/find.stdout (tool emits the final ranking line there
          # when stdout is piped); stderr -> streamed live AND captured via tee
          # so you can follow the probe/speed-test progress in the Actions log.
          /tmp/fast-apt-mirror.sh find \
            --country US \
            --ignore-sync-state \
            --healthchecks 40 \
            --speedtests 10 \
            --parallel 1 \
            --sample-size "$SAMPLE_SIZE_KB" \
            --sample-time "$SAMPLE_TIME" \
            -v > /tmp/find.stdout 2> >(tee /tmp/find.log >&2) || echo "WARNING: fast-apt-mirror.sh exit: $?"

          echo "fastest mirror reported: $(tail -n1 /tmp/find.stdout)"

      - name: Enable workflow metrics (instruments only the steps after this point)
        # Replacement for tum-i4/workflow-telemetry-action: renders Mermaid
        # charts of CPU load / memory usage directly into the job summary
        # from a localhost collection server (127.0.0.1:7777) — no third-party
        # chart API, so no 403s. Node24 runtime (no deprecation warning).
        # Only inputs are github_token and interval_seconds; process tracing
        # does not exist in this action (the old action's proc_trace flags
        # were no-ops on Ubuntu 24.04 anyway).
        uses: dev-hato/actions-workflow-metrics@17543dcae6053a945244b76ec3224f0e4b9395c6 # v0.0.9
        with:
          interval_seconds: "5"

      - name: End-to-end apt timing (update + install ffmpeg)
        env:
          APT_DEBUG: ${{ inputs.apt_debug }}
        run: |
          # Measures what users actually experience: full apt-get update (all
          # metadata files incl. Contents, ~150+ MB total) plus a real package
          # download+install through the runner's own mirror+file config.
          #
          # Output: apt runs raw (no -qq, uncondensed Get:/Fetched/progress
          # lines) mirrored live to stdout; per-mirror resolved IP printed
          # first so every Get: line is attributable to a known edge IP.
          set -u

          debug_opts=""
          if [ "$APT_DEBUG" = "true" ]; then
            debug_opts="-o Debug::Acquire::http=true -o Debug::Acquire::https=true"
            echo "APT_DEBUG on: per-request connect IP / HTTP lines enabled"
          fi

          # Which IP does each configured mirror host resolve to? All fetches
          # below go through these, starting with priority-1 azure (a single
          # regional CDN IP).
          echo "::group::Mirror host -> resolved IP"
          cut -f1 /etc/apt/apt-mirrors.txt | awk '/^https?:/ && !seen[$0]++' | \
          while IFS= read -r mirror; do
            host=$(printf '%s\n' "$mirror" | sed -n 's|^https\?://\([^/]*\)/.*|\1|p')
            echo "$host:"
            dig +short A "$host"
          done
          echo "::endgroup::"

          # Single timed invocation, the runner's pristine config, no wiping
          # or forced update beforehand. -d = download .debs only, no install.
          t0=$(date +%s.%N)
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 $debug_opts -y -d --no-install-recommends \
            install yajl-tools ffmpeg libsm6 libxext6 libxml2-dev libxslt-dev \
            2>&1 | tee /tmp/e2e-install.log
          rc=$?
          t1=$(date +%s.%N)
          secs=$(awk -v e="$t1" -v s="$t0" 'BEGIN{printf "%.1f", e-s}')
          printf 'install\t%.1f\trc=%s\n' "$secs" "$rc" | tee -a /tmp/e2e.log
          echo "=== install wall-clock: ${secs}s, exit: $rc ==="
          [ "$rc" -eq 0 ]

      - name: Per-URL timed fetch — every index target apt update would download
        run: |
          # `apt-get indextargets` is apt's own enumeration of every URI the
          # update phase would fetch. Timing each one (sequential curl) shows
          # exactly WHICH file is slow (per-request overhead / edge-cache
          # miss / origin fetch) — data apt itself never reports.
          set -o pipefail
          : > /tmp/perfile.tsv

          sudo apt-get indextargets 2>/dev/null \
            | sed -n 's/^URI: //p' | sort -u > /tmp/targets.txt
          echo "index targets: $(wc -l < /tmp/targets.txt)"
          [ -s /tmp/targets.txt ] || { echo "WARNING: no targets enumerated"; exit 0; }

          while IFS= read -r uri; do
            st=$(curl -fsSL -m 60 -sS -o /dev/null \
                    -w '%{http_code}\t%{time_starttransfer}\t%{size_download}\t%{speed_download}\t%{time_total}' \
                    "$uri") || true
            [ -n "$st" ] || st=$(printf '000\t0\t0\t0\t0')
            printf '%s\t%s\n' "$uri" "$st" | tee -a /tmp/perfile.tsv
          done < /tmp/targets.txt

          awk -F'\t' '{ d+=$4; t+=$6; n++ }
            END { printf "TOTAL\t%.1f MB\t%.1f s\t%d files\teffective %.2f MB/s\n",
                  d/1048576, t, n, (t>0 ? d/1048576/t : 0) }' /tmp/perfile.tsv | tee /tmp/perfile.total

      - name: Write run summary
        if: always()
        run: |
          {
            echo "# APT mirror benchmark — ${{ matrix.arch }}"
            echo
            run_date=$(date -u +'%Y-%m-%d %H:%M UTC')
            echo "Runner \`${{ runner.name }}\` · ${run_date} · tool fast-apt-mirror.sh ${TOOL_VERSION}"
            echo
            echo "## Runner apt failover config"
            echo
            echo '```'
            cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo "(not present)"
            echo '```'
            echo
            echo "## Baseline — apt-mirrors.txt entries (cut -f1), in priority order"
            echo
            echo "Sequential curl on \`\${mirror}ls-lR.gz\` (~37 MB), ${SAMPLE_TIME}s max each."
            echo
            echo "| mirror | http | TTFB (s) | size | speed |"
            echo "|---|---|---|---|---|"
            while IFS=$'\t' read -r mirror code ttfb bytes speed; do
              [ -n "$mirror" ] || continue
              printf '| %s | %s | %s | %s MB | %s |\n' "$mirror" "$code" "$ttfb" \
                "$(awk -v b="${bytes:-0}" 'BEGIN{printf "%.1f", b/1048576}')" \
                "$(awk -v s="${speed:-0}" 'BEGIN{printf "%.2f MB/s", s/1048576}')"
            done < /tmp/baseline.tsv
            echo
            echo "## fast-apt-mirror.sh top-10 US + current (37 MB, sequential)"
            echo
            echo "### Speed ranking"
            echo
            echo '```'
            grep ' -> ' /tmp/find.log | grep '/s)' | tail -n 15 || true
            echo '```'
            echo
            echo "### Probe results"
            echo
            echo '```'
            grep ' -> ' /tmp/find.log | grep -v '/s)' | head -n 60 || true
            echo '```'
            echo
            echo "### Final result line"
            echo
            echo "$(tail -n1 /tmp/find.stdout 2>/dev/null)"
            echo
            echo "## End-to-end apt timing (real \$\(apt-get\), sequential)"
            echo
            for f in /tmp/e2e-install.log; do
              echo "### \`$f\` — summary"
              echo
              echo '```'
              grep -E '^Fetched |^Need to get|^After this operation|^=== exit' "$f" | sort -u | head -n 6
              echo '```'
              echo
            done
            echo "## Per-URL index timing (apt-get indextargets URIs, sequential curl)"
            echo
            echo "Total: \`$(cat /tmp/perfile.total 2>/dev/null || echo "n/a")\`"
            echo
            echo "### 10 slowest targets (by total time)"
            echo
            echo "| URI | http | TTFB (s) | size (MB) | MB/s | total (s) |"
            echo "|---|---|---|---|---|---|"
            sort -t$'\t' -k6,6 -gr /tmp/perfile.tsv 2>/dev/null | head -n 10 | \
              while IFS=$'\t' read -r uri code ttfb bytes speed total; do
                [ -n "$uri" ] || continue
                printf '| %s | %s | %s | %s | %s | %s |\n' "$uri" "$code" "$ttfb" \
                  "$(awk -v b="${bytes:-0}" 'BEGIN{printf "%.2f", b/1048576}')" \
                  "$(awk -v s="${speed:-0}" 'BEGIN{printf "%.1f", s/1048576}')" \
                  "$(awk -v t="${total:-0}" 'BEGIN{printf "%.3f", t}')"
              done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorbench-${{ matrix.arch }}-${{ github.run_number }}
          retention-days: 90
          path: |
            /tmp/baseline.tsv
            /tmp/find.log
            /tmp/find.stdout
            /tmp/e2e-install.log
            /tmp/perfile.tsv
            /tmp/perfile.total
            /tmp/targets.txt
          if-no-files-found: warn
